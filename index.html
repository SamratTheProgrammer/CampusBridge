<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CampusBridge</title>
    <script>
      (function() {
        try {
          var isMobileApp = (typeof window !== 'undefined' && (
            navigator.userAgent.indexOf('CampusBridgeMobile') !== -1 ||
            navigator.userAgent.indexOf('Capacitor') !== -1 ||
            (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
          ));
          if (isMobileApp) {
            document.documentElement.classList.add('cb-capacitor-app');
          }
          var savedSiteLang = localStorage.getItem('campusbridge_site_lang');
          if (savedSiteLang && savedSiteLang !== 'en') {
            document.cookie = 'googtrans=/en/' + savedSiteLang + '; path=/;';
          } else {
            var past = 'Thu, 01 Jan 1970 00:00:00 UTC';
            document.cookie = 'googtrans=; expires=' + past + '; path=/;';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body style="margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0a0f1d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <img src="/icon-192x192.png" alt="CampusBridge" style="width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.5);" />
        <div style="width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #8b5cf6; border-radius: 50%; animation: cb-spin 0.8s linear infinite;"></div>
        <style>
          @keyframes cb-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <div id="google_translate_element" style="position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0.01; overflow: hidden; pointer-events: none;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'hi,bn,en,mr,te,ta,gu,ur,kn,ml,pa,es,fr,de,ja,ar,ru,zh-CN',
              autoDisplay: false
            }, 'google_translate_element');

            var savedLang = localStorage.getItem('campusbridge_site_lang');
            if (savedLang && savedLang !== 'en') {
              var attempts = 0;
              var pollCombo = setInterval(function() {
                var select = document.querySelector('.goog-te-combo');
                if (select) {
                  clearInterval(pollCombo);
                  if (select.value !== savedLang) {
                    select.value = savedLang;
                    select.dispatchEvent(new Event('change'));
                  }
                }
                attempts++;
                if (attempts > 50) clearInterval(pollCombo);
              }, 100);
            }
          }
        } catch(e) {}
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
